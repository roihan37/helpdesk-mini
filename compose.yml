x-app-environment: &app-environment
  JWT_ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: "15"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  REFRESH_COOKIE_SECURE: "false"
  CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"

# Fixed, public credentials are for this loopback-only local demo, not production.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: helpdesk_demo
      POSTGRES_PASSWORD: local-demo-postgres-only
      POSTGRES_DB: helpdesk_mini_demo

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - demo_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 5s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: ./backend
      target: runtime

    restart: unless-stopped

    environment:
      <<: *app-environment
      DATABASE_URL: postgresql+psycopg://helpdesk_demo:local-demo-postgres-only@db:5432/helpdesk_mini_demo
      DEMO_SEED_PASSWORD: HelpdeskDemo2026!

    volumes:
      - demo_backend_state:/var/lib/helpdesk-demo

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "127.0.0.1:8000:8000"

    command: ["python", "-m", "app.scripts.start_demo"]

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000

    restart: unless-stopped

    environment:
      NODE_ENV: production

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "127.0.0.1:3000:3000"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  test-db:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: helpdesk_test
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: helpdesk_compose_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 5s
      timeout: 3s
      retries: 15

  tests:
    profiles: [test]
    build:
      context: ./backend
      target: tests
    environment:
      <<: *app-environment
      DATABASE_URL: postgresql+psycopg://helpdesk_test:local-test-only@test-db:5432/helpdesk_compose_test
      TEST_DATABASE_URL: postgresql+psycopg://helpdesk_test:local-test-only@test-db:5432/helpdesk_compose_test
      M1_TEST_DATABASE_URL: postgresql+psycopg://helpdesk_test:local-test-only@test-db:5432/helpdesk_compose_test
      JWT_SECRET: compose-test-only-secret-not-for-production-2026
    depends_on:
      test-db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && pytest -q --tb=short && alembic check"]

volumes:
  demo_postgres_data:
  demo_backend_state:

[project]
name = "helpdesk-mini-backend"
version = "0.1.0"
description = "FastAPI backend for HelpDesk Mini"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
